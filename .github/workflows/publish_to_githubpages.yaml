name: Publish to github pages

# Pull requests run the same build as `main`, so a site that builds on its
# pull request also deploys. Only `main` deploys.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A new push to the same ref supersedes older builds. Deploys are never
# cancelled halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build GitHub Pages
    # macOS, because `install.sh` installs this binary on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze
      - run: mkdir -p web/download
      - run: dart compile exe bin/impaktfull_cli.dart -o web/download/impaktfull_cli
      # The binary users download with `install.sh` has to start.
      - name: Run the compiled cli
        run: web/download/impaktfull_cli --help
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "./web"

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
