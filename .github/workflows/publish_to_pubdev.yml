name: Publish to pub.dev

# Triggered by the tag release-please pushes when its release PR is merged.
# pub.dev is configured to accept tags matching `v{{version}}` from the
# `pub.dev` environment; both must stay in sync with that setting.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  # Everything that could make this fail (analyze, tests, the publish dry run
  # on the same toolchain) already ran on the release pull request, so this
  # only publishes. `dart-lang/setup-dart` with `id-token: write` sets up the
  # pub.dev authentication.
  publish:
    name: Publish to pub.dev
    environment: pub.dev
    permissions:
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same setup as the `Validate` job in `test.yaml`; keep them in sync.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart pub publish --force
