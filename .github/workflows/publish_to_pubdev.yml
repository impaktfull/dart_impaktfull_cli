name: Publish to pub.dev

# Triggered by the tag release-please pushes when its release PR is merged.
# pub.dev is configured to accept tags matching `v{{version}}` from the
# `pub.dev` environment; both must stay in sync with that setting.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  publish:
    permissions:
      id-token: write # Required for authentication using OIDC
    # Pinned, so a change in that repository reaches a release only through a
    # pull request here (Dependabot), which runs the checks in `test.yaml`.
    uses: impaktfull/gh_action_dart_conventional_release/.github/workflows/flutter_release.yml@7bdbc0cb8b669d78429febd4440865d4a97cd8d7 # v0.7.0
    with:
      environment: "pub.dev"
