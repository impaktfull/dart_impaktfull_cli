name: Automated tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to the same ref supersedes older runs instead of queueing them.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format, analyze, docs and a publish dry run: everything that does not
  # depend on the host platform.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze
      - name: Check docs are up to date
        run: |
          dart run tool/generate_docs.dart
          git diff --exit-code docs/ README.md
      - run: dart pub publish --dry-run

  # impaktfull_cli starts other tools (flutter, fvm, git, ...) on every OS, and
  # how a process is started, found on the PATH and read from differs per OS.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Some tests read source files. Without this, Windows checks them out
      # with `\r\n` line endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test
