name: Automated tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# On a pull request, a new push supersedes older runs instead of queueing them.
# Every commit on `main` is tested on its own: merges that land close together
# can start their runs out of order, and an older commit must never cancel the
# run of a newer one.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, analyze, docs and a publish dry run: everything that does not
  # depend on the host platform.
  #
  # Uses the same setup as `publish_to_pubdev.yml` (Dart stable on Ubuntu), so
  # a release that passed this job on its release pull request also publishes.
  # Keep the two in sync.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --set-exit-if-changed .
      - run: dart analyze
      - name: Check docs are up to date
        run: |
          dart run tool/generate_docs.dart
          git diff --exit-code docs/ README.md
      # Fails on warnings too. The publish itself uses `--force`, so this is
      # the only place they are caught.
      - run: dart pub publish --dry-run

  # impaktfull_cli starts other tools (flutter, fvm, git, ...) on every OS, and
  # how a process is started, found on the PATH and read from differs per OS.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Some tests read source files. Without this, Windows checks them out
      # with `\r\n` line endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test

  # Runs the compiled cli against a real Flutter project, the way it runs on CI
  # machines: it has to find flutter on the PATH, start it (a `.bat` file on
  # Windows) and read its output.
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - name: Compile the cli
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          dart compile exe bin/impaktfull_cli.dart -o "$RUNNER_TEMP/bin/impaktfull_cli${{ runner.os == 'Windows' && '.exe' || '' }}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Create a Flutter project
        working-directory: ${{ runner.temp }}
        run: flutter create e2e_app
      # Fails when flutter is not detected as installed, when it cannot be
      # started, or when its output is lost.
      - name: impaktfull_cli test_coverage flutter
        working-directory: ${{ runner.temp }}/e2e_app
        run: impaktfull_cli test_coverage flutter -v
      # A project with an `.fvmrc` on a runner without fvm, the usual setup on
      # GitHub-hosted runners: impaktfull_cli falls back to the `flutter` on the
      # PATH and reports whether it is the version `.fvmrc` pins.
      - name: impaktfull_cli test_coverage flutter (fvm project, fvm not installed)
        working-directory: ${{ runner.temp }}/e2e_app
        run: |
          if command -v fvm; then
            echo "fvm is installed on this runner, so the fallback is not tested"
            exit 1
          fi
          flutter_version=$(flutter --version --machine | jq -r .frameworkVersion)
          echo "{\"flutter\": \"$flutter_version\"}" > .fvmrc
          impaktfull_cli test_coverage flutter | tee output.txt
          grep -q "pins \`$flutter_version\`: matches" output.txt
